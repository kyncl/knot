[package]
name = "knot"
version = "0.0.1"
edition = "2024"
authors = ["kyncl <145004616+kyncl@users.noreply.github.com>"]
description = "A TUI utility for synchronizing multiple folders (knots) across devices"
repository = "https://github.com/kyncl/knot"
license = "GPL-3.0-only"
keywords = ["tui", "sync", "ratatui", "ssh", "backup"]
categories = ["command-line-utilities", "filesystem", "network-programming"]

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true

[dependencies]
# --- Async & Concurrency ---
async-recursion = "1.1.1"
async-trait = "0.1.92"
deadpool = "0.13.1"
futures = "0.3.34"
rayon = "1.12.0"
tokio = { version = "1.53.1", features = ["full"] }

# --- CLI & User Interface ---
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.9"
colored = "3.1.1"
comfy-table = "8.0.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
indicatif = "0.18.4"
inquire = "0.9.4"
ratatui = "0.30.2"
terminal_size = "0.4.4"

# --- Error Handling & Diagnostics ---
anyhow = "1.0.102"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- System & OS Integration ---
dirs = "6.0.0"
ignore = "0.4.33"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
notify-rust = "4.18.0"
whoami = "2.1.2"

# --- Serialization & Compression ---
base64 = "0.22.1"
rkyv = { version = "0.8.18", features = ["std", "alloc", "bytecheck"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
toml_edit = "0.25.12"
zstd = "0.13.3"
tar = "0.4.46"

# --- Data Types & Utilities ---
chrono = "0.4.45"
parse-size = "1.1.0"
strum = "0.28"
strum_macros = "0.28"
xxhash-rust = { version = "0.8.18", features = ["xxh3", "const_xxh3"] }
rand = "0.10.2"

# --- Cryptography ---
aes-gcm = "0.10.3"

[target.'cfg(unix)'.dependencies]
russh = "0.61.2"

[target.'cfg(windows)'.dependencies]
russh = { version = "0.61.2", default-features = false, features = ["ring"] }
